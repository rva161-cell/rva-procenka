<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет — RVA</title>
<style>
  :root{
    --bg:#0d1b2a; --bg2:#13263c; --panel:#16293f; --line:#24405d;
    --accent:#ff8c1a; --text:#e9eff6; --muted:#9db0c4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:50;background:rgba(13,27,42,.95);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}
  .logo-badge{width:36px;height:36px;background:linear-gradient(135deg,#f77f00,#ffb566);border-radius:8px;display:grid;place-items:center;color:#0d1b2a;font-size:14px;font-weight:900}
  .navbtns{display:flex;gap:10px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:0}
  .btn-acc{background:var(--accent);color:#12100c}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  h1{font-size:26px;margin:34px 0 6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  section{margin-bottom:36px}
  section h2{font-size:19px;margin-bottom:14px}
  #adminBox{padding-top:30px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px;color:var(--text);font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row .k{width:180px;color:var(--muted);font-size:13px}
  .lvl{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--muted)}
  .lvl.ok{color:var(--accent);border-color:rgba(255,140,26,.5)}
  .st{font-size:13px}
  .st.ok{color:#7dd97b}.st.pend{color:#ffd479}
  .err{display:none;font-size:13px;margin-top:10px;color:#ffb1b1}
  .muted{color:var(--muted);font-size:13px}
  .gate{max-width:480px;margin:80px auto;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:36px}
  .gate p{color:var(--muted);margin-bottom:18px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  /* «глазок» у полей пароля: показать / скрыть введённое */
  .pw{position:relative;display:block}
  .pw input{padding-right:46px !important}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:6px;color:var(--muted);cursor:pointer;padding:0}
  .pw-eye:hover{color:var(--text)}
  .pw-eye[aria-pressed="true"]{color:var(--accent)}
  .pw-eye:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .pw-eye svg{width:20px;height:20px}
  .logo-img{width:40px;height:40px;border-radius:8px;display:block}
  /* срок доступа */
  .accessbar{text-align:center;font-size:14px;padding:9px 16px;border-bottom:1px solid var(--line);background:rgba(255,140,26,.08)}
  .accessbar b{color:var(--accent);font-size:15px}
  .accessbar.low{background:rgba(255,196,0,.12)}
  .accessbar.off{background:rgba(255,107,107,.12);color:#ffb1b1}
  /* таблица пользователей (админ) */
  .wide{max-width:1560px;margin:0 auto;padding:0 24px}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .tools input{width:auto}
  .tools .grow{flex:1;min-width:220px}
  .tblbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
  table.ut{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
  table.ut th{background:#1a3049;text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
  table.ut th:hover{color:var(--text)}
  table.ut td{padding:9px 12px;border-bottom:1px solid #1d3450;vertical-align:top}
  table.ut tr:last-child td{border-bottom:0}
  table.ut a{color:var(--accent)}
  table.ut td:nth-child(7){min-width:200px}   /* «Пригласил» с цепочкой */
  .days{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:190px;max-width:230px}
  .days input{width:62px;padding:6px 8px;text-align:right;font-weight:700}
  .btn-sm{padding:6px 10px;font-size:12px}
  .dleft{font-size:12px;color:var(--muted);width:100%}
  .dleft.off{color:#ffb1b1}.dleft.low{color:#ffd479}
  .q-item{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .q-item .meta{color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">
      <img class="logo-img" src="/logo.png" alt="RVA161">
      <span>ЛИЧНЫЙ КАБИНЕТ</span>
    </a>
    <div class="navbtns">
      <a class="btn btn-ghost" href="/poisk">Проценка</a>
      <a class="btn btn-ghost" href="/">Главная</a>
    </div>
  </div>
</header>

<div class="accessbar" id="accessbar" style="display:none" role="status"></div>
<div class="wrap" id="content">
  <div id="loading" class="muted">Загрузка…</div>
</div>

<script>
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
const LVL = {1:'1 — гость',2:'2 — зарегистрирован',3:'3 — своя Проценка',4:'4 — моя Проценка'};
const CONTENT = document.getElementById('content');
let profile = null;

function profileBlock(p){
  const fio = [p.surname, p.name, p.patronymic].filter(Boolean).join(' ');
  return `
  <section><h2>Мой профиль</h2>
    <div class="card">
      <div class="row"><div class="k">ФИО</div><div>${esc(fio) || '—'}</div></div>
      <div class="row"><div class="k">Email (логин)</div><div>${esc(p.login)}</div></div>
      <div class="row"><div class="k">Телефон</div><div>${esc(p.phone ? '+' + p.phone : '—')}</div></div>
      <div class="row"><div class="k">Статус</div><div>${p.approved ? '<span class="st ok">подтверждён</span>' : '<span class="st pend">ждёт подтверждения администратора</span>'}</div></div>
      <div class="row"><div class="k">Доступ к проценке</div><div>${accessLine(p.access)}</div></div>
      <div class="row"><div class="k">Уровень доступа</div><div><span class="lvl">${LVL[p.level] || ('уровень ' + p.level)}</span>${p.discount ? ' · 🎁 скидка ' + p.discount + '%' : ''}</div></div>
      <div class="row"><div class="k">В боте MAX</div><div>бот Prodobrey привязан к вашему номеру</div></div>
    </div>
  </section>`;
}

function passwordBlock(){
  return `
  <section><h2>Смена пароля</h2>
    <div class="card">
      <label>Старый пароль</label><input id="pOld" type="password">
      <label>Новый пароль (от 8 символов)</label><input id="pNew" type="password">
      <label>Повторите новый пароль</label><input id="pNew2" type="password">
      <div class="err" id="pErr"></div>
      <div style="margin-top:14px"><button class="btn btn-acc" onclick="changePass()">Сменить пароль</button></div>
    </div>
  </section>`;
}

function profileEditBlock(){
  return `
  <section><h2>Изменить профиль</h2>
    <div class="card">
      <label>Имя</label><input id="eName" value="${esc(profile.name)}">
      <label>Фамилия</label><input id="eSurname" value="${esc(profile.surname)}">
      <label>Отчество</label><input id="ePatronymic" value="${esc(profile.patronymic)}">
      <label>Телефон</label><input id="ePhone" value="${esc(profile.phone ? '+' + profile.phone : '')}">
      <div class="err" id="eErr"></div>
      <div style="margin-top:14px"><button class="btn btn-acc" onclick="saveProfile()">Сохранить профиль</button></div>
      <div class="hint">Email (логин) изменить нельзя.</div>
    </div>
  </section>`;
}


function fdate(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }

function err(id, msg){ const e = document.getElementById(id); e.style.color = '#ffb1b1'; e.textContent = msg; e.style.display = 'block'; }
function okMsg(id, msg){ const e = document.getElementById(id); e.style.color = '#7dd97b'; e.textContent = msg; e.style.display = 'block'; }

async function changePass(){
  const old_p = pOld.value, new_p = pNew.value, new2 = pNew2.value;
  pErr.style.display = 'none';
  if (new_p.length < 8) return err('pErr', 'Новый пароль — от 8 символов');
  if (new_p !== new2) return err('pErr', 'Пароли не совпадают');
  const r = await fetch('/api/auth/password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ old: old_p, new: new_p }) });
  const d = await r.json();
  if (!r.ok || d.error) return err('pErr', d.error || 'Ошибка');
  okMsg('pErr', '✓ ' + d.message);
  pOld.value = pNew.value = pNew2.value = '';
}
async function saveProfile(){
  eErr.style.display = 'none';
  const body = {
    name: eName.value.trim(), surname: eSurname.value.trim(),
    patronymic: ePatronymic.value.trim(), phone: ePhone.value.trim()
  };
  if (!body.name) return err('eErr', 'Укажите имя (обязательно)');
  const r = await fetch('/api/auth/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok || d.error) return err('eErr', d.error || 'Ошибка');
  okMsg('eErr', '✓ ' + d.message);
}

async function load(){
  const me = (await (await fetch('/api/auth/me')).json()).user;
  if (!me) {
    CONTENT.innerHTML = '<div class="gate"><h2>Личный кабинет</h2><p>Сначала войдите на странице проценки под своим email и паролем.</p><a class="btn btn-acc" href="/poisk">Перейти к входу</a></div>';
    return;
  }
  const prof = (await (await fetch('/api/auth/profile')).json()).profile;
  profile = prof;
  const isAdmin = me.role === 'admin';
  renderAccessBar(me);
  let html = `<h1>Личный кабинет</h1><p class="sub">Вы вошли как <b>${esc(prof.login)}</b>${me.approved ? '' : ' · <span class="st pend">ждёт подтверждения</span>'}</p>`;
  html += profileBlock(prof) + profileEditBlock() + passwordBlock();
  CONTENT.innerHTML = html;
  if (isAdmin) await loadAdmin();
  addPasswordEyes(CONTENT);
}


// ---------- срок платного доступа ----------
function daysWord(n){ const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? 'день' : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? 'дня' : 'дней'; }
const dshort = ts => ts ? new Date(ts).toLocaleDateString('ru-RU') : '';
function accessLine(a){
  if (!a) return '—';
  if (a.unlimited) return a.auto ? 'без ограничения срока' : '<span class="st ok">бессрочно</span>';
  if (a.days > 0) return `<span class="st ok">открыт на ${a.days} ${daysWord(a.days)}</span> · до ${dshort(a.until)} включительно`;
  return '<span class="st pend">закончился — для продления свяжитесь с нами</span>';
}
function renderAccessBar(me){
  const bar = document.getElementById('accessbar'), a = me && me.access;
  if (!me || !me.approved || !a || me.role === 'admin' || (a.unlimited && a.auto)) { bar.style.display = 'none'; return; }
  bar.className = 'accessbar'; bar.style.display = 'block';
  if (a.unlimited) bar.innerHTML = 'Доступ к проценке открыт <b>бессрочно</b>';
  else if (a.days > 0) { bar.innerHTML = `Открыт доступ на <b>${a.days} ${daysWord(a.days)}</b> · до ${dshort(a.until)} включительно`; if (a.days <= 5) bar.classList.add('low'); }
  else { bar.innerHTML = 'Доступ к полной проценке закончился. Для продления свяжитесь с нами.'; bar.classList.add('off'); }
}

// ---------- администратор: пользователи, доступ, приглашения, история ----------
let U = [], sortKey = 'created', sortDir = -1, filterText = '';
const fdt = ts => ts ? new Date(ts).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
async function loadAdmin(){
  let ud, logd, info, opd, regd;
  try {
    [ud, logd, info, opd, regd] = await Promise.all([
      fetch('/api/admin/users').then(r => r.json()), fetch('/api/admin/access-log').then(r => r.json()), fetch('/api/admin/info').then(r => r.json()),
      fetch('/api/admin/orgpeople').then(r => r.json()).catch(() => ({ people: [] })),
      fetch('/api/admin/registrations').then(r => r.json()).catch(() => ({ regs: [] }))]);
  } catch (e) { alert('Не удалось загрузить таблицы кабинета: ' + e.message); return; }
  CLOSE = opd.people || [];
  REGS = regd.regs || [];
  U = ud.users || [];
  filterText = "";   // после любого сохранения таблица показывается целиком (поиск — только на время набора)
  const box = document.createElement('div');
  box.className = 'wide'; box.id = 'adminBox';
  box.innerHTML = `
  <section><h2 id="regTitle">Заявки на регистрацию (${REGS.length})</h2>
    <p class="muted" style="margin:4px 0 8px">Форму заполнили, но email из письма не подтвердили — в пользователи они не попали и на сайт войти не могут. «Повторить письмо» высылает новую ссылку (на подтверждение снова даётся 24 часа), «Удалить» убирает заявку — тогда человек сможет зарегистрироваться заново.</p>
    <div class="tblbox"><table class="ut"><thead><tr>
      <th>Имя / Email</th><th>Телефон</th><th>Заявка создана</th><th>Письмо отправлено</th><th>Действия</th>
    </tr></thead><tbody id="regBody"></tbody></table></div>
  </section>
  <section><h2>Пользователи и доступ к проценке (${U.length})</h2>
    <div class="tools">
      <input type="text" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input class="grow" id="uFilter" readonly onfocus="this.removeAttribute('readonly')" autocomplete="off" placeholder="Поиск: имя, email, телефон…" oninput="filterText=this.value.toLowerCase();renderUsers()">
      <span class="muted">Пробный срок при одобрении:</span>
      <input id="trialDays" type="number" min="0" max="365" style="width:70px" value="${esc(ud.trialDays ?? 0)}" oninput="trialDirty()"> <span class="muted">дн.</span>
      <button id="trialSave" class="btn btn-ghost btn-sm" onclick="saveTrial()">Сохранить</button>
      <a class="btn btn-acc btn-sm" href="/api/admin/export.xlsx">⬇ Скачать в Excel</a>
    </div>
    <div class="tblbox"><table class="ut"><thead><tr>
      <th data-k="fio">ФИО / Email</th><th data-k="phone">Телефон</th><th data-k="msg">Мессенджеры</th><th data-k="approved">Статус</th>
      <th data-k="created">Регистрация</th><th data-k="last_login">Последний вход</th><th data-k="invited_by">Пригласил</th>
      <th data-k="invited_count">Пригласил(а)</th><th data-k="level">Ур.</th><th data-k="days">Дней доступа</th><th data-k="photos">Фото</th>
    </tr></thead><tbody id="uBody"></tbody></table></div>
    <p class="muted" style="margin-top:10px">«Дней доступа» — сколько дней с сегодняшнего (включительно) будет открыта полная проценка; число уменьшается каждый день. 0 — закрыть, ∞ — бессрочно. «+30» и «+365» прибавляют к остатку. Подтвердить новую регистрацию — кнопкой в колонке «Статус». «Фото» — сколько распознаваний по фото В ДЕНЬ: по умолчанию 2 (подключившиеся в боте), 4 (зарегистрированные), 6 (с доступом к проценке); внесённое вручную число перекрывает уровень.</p>
  </section>
  <section><h2>Близкие — 4-й и 5-й уровни</h2>
    <p class="muted" style="margin:4px 0 8px">Список 5-го уровня (organizer_people.json) — доступ к органайзеру. Галочка «Четвёртый уровень» — доступ к моей странице Проценки (оценка по артикулу, без добавления поставщиков и без кабинета поставщиков).</p>
    <div class="tblbox"><table class="ut"><thead><tr>
      <th>Имя / Логин</th><th>Телефон</th><th>Мессенджер</th><th>Органайзер (5)</th><th>Четвёртый уровень</th>
    </tr></thead><tbody id="closeBody"></tbody></table></div>
  </section>
  <section><h2>Кто кого пригласил</h2><div class="card" id="refTree"></div></section>
  <section><h2>История доступа (последние ${Math.min((logd.log || []).length, 50)})</h2><div class="card" id="accLog"></div></section>
  <section><h2>Вопросы из бота (${(info.questions || []).length})</h2><div class="card">${(info.questions || []).length ? info.questions.slice().reverse().slice(0, 100).map(q => `
    <div class="q-item"><div class="meta">${esc(fdate(q.date))} · ${esc(q.transport)}${q.from ? ' · ' + esc(q.from) : ''}</div><div>${esc(q.text)}</div></div>`).join('') : '<div class="muted">Вопросов пока нет</div>'}</div></section>`;
  document.getElementById('adminBox')?.remove();
  CONTENT.before(box);   // у администратора таблица пользователей — первой, профиль — ниже
  box.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; renderUsers(); });
  const uf = document.getElementById('uFilter');
  if (uf) uf.value = filterText;   // поле поиска всегда открывается пустым, что бы ни восстановил браузер
  renderUsers(); renderTree(); renderLog(logd.log || []); renderClose(); renderRegs();
  setTimeout(() => { const u2 = document.getElementById('uFilter'); if (u2) u2.value = filterText; }, 0);
}
let CLOSE = [];
// ---------- заявки на регистрацию (email не подтверждён) ----------
let REGS = [];
function renderRegs(){
  const b = document.getElementById('regBody'); if (!b) return;
  b.innerHTML = REGS.length ? REGS.map(r => `<tr>
      <td><b>${esc([r.surname, r.name, r.patronymic].filter(Boolean).join(' ') || '—')}</b><br><a href="mailto:${esc(r.login)}">${esc(r.login)}</a></td>
      <td>${r.phone ? `<a href="tel:+${esc(r.phone)}">+${esc(r.phone)}</a>` : '—'}</td>
      <td>${fdt(r.created)}</td><td>${fdt(r.sent)}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="regResend('${esc(r.login)}')">Повторить письмо</button>
          <button class="btn btn-acc btn-sm" onclick="regDelete('${esc(r.login)}')">Удалить</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="muted">Заявок, ждущих подтверждения почты, нет</td></tr>';
}
async function regReload(){
  const d = await fetch('/api/admin/registrations').then(r => r.json()).catch(() => ({ regs: [] }));
  REGS = d.regs || [];
  const t = document.getElementById('regTitle'); if (t) t.textContent = `Заявки на регистрацию (${REGS.length})`;
  renderRegs();
}
async function regAction(body, silent){
  const r = await fetch('/api/admin/registrations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok || d.error) return alert(d.error || 'Ошибка');
  if (!silent) alert(d.message || 'Готово');
  await regReload();
}
async function regResend(login){ await regAction({ login, action: 'resend' }); }
async function regDelete(login){
  if (!confirm('Удалить заявку ' + login + '? Подтвердить email она больше не сможет — только зарегистрироваться заново.')) return;
  await regAction({ login, action: 'delete' }, true);
}
function renderClose(){
  const b = document.getElementById('closeBody'); if (!b) return;
  b.innerHTML = CLOSE.length ? CLOSE.map(p => `<tr>
      <td><b>${esc(p.name || '—')}</b>${p.login ? `<br><a href="mailto:${esc(p.login)}">${esc(p.login)}</a>` : ''}</td>
      <td>${p.phone ? `<a href="tel:+${esc(p.phone)}">+${esc(p.phone)}</a>` : '—'}</td>
      <td>${[p.max_id ? 'MAX' : '', p.telegram_id ? 'Telegram' : ''].filter(Boolean).join(', ') || '<span class="muted">—</span>'}</td>
      <td><span class="st ok">есть</span></td>
      <td><label class="consent" style="justify-content:center"><input type="checkbox" ${p.level4 ? 'checked' : ''} onchange="saveLevel4(this, ${JSON.stringify({ login: p.login || '', phone: p.phone || '', name: p.name || '' }).replace(/"/g, '&quot;')})"> 4-й уровень</label></td></tr>`).join('')
    : '<tr><td colspan="5" class="muted">Список 5-го уровня пуст (файл organizer_people.json)</td></tr>';
}
async function saveLevel4(input, key){
  input.disabled = true;
  const r = await fetch('/api/admin/orgpeople', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...key, level4: input.checked }) });
  const d = await r.json().catch(() => ({}));
  input.disabled = false;
  if (!r.ok || d.error) alert(d.error || 'Ошибка');
}
function daysVal(u){ return u.access.unlimited ? Infinity : u.access.days; }
function sortVal(u, k){
  if (k === 'days') return daysVal(u);
  if (k === 'msg') return (u.max ? 2 : 0) + (u.telegram ? 1 : 0);
  if (k === 'fio') return (u.fio || u.login).toLowerCase();
  const v = u[k]; return typeof v === 'string' ? v.toLowerCase() : (v ?? -1);
}
function renderUsers(){
  const body = document.getElementById('uBody'); if (!body) return;
  const list = U.filter(u => !filterText || [u.fio, u.login, u.email, u.phone, u.invited_by].join(' ').toLowerCase().includes(filterText))
    .sort((a, b) => { const x = sortVal(a, sortKey), y = sortVal(b, sortKey); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  body.innerHTML = list.map(u => {
    const a = u.access;
    const st = u.approved ? '<span class="st ok">подтверждён</span>'
      : `<span class="st pend">ждёт подтверждения</span><br><button class="btn btn-acc btn-sm" style="margin-top:4px" onclick="approve('${esc(u.id)}')">Подтвердить</button>`;
    let days;
    if (a.unlimited && a.auto) days = `<span class="muted">${u.role === 'admin' ? 'администратор' : '«близкий»'} — без срока</span>`;
    else {
      const left = a.unlimited ? '<span class="dleft">бессрочно</span>'
        : a.days > 0 ? `<span class="dleft ${a.days <= 5 ? 'low' : ''}">осталось ${a.days} ${daysWord(a.days)} · до ${dshort(a.until)}</span>`
        : '<span class="dleft off">доступ закрыт</span>';
      days = `<div class="days">${left}
        <input type="number" min="0" max="3650" id="d_${esc(u.id)}" value="${a.unlimited ? '' : a.days}" placeholder="∞" title="Дней доступа с сегодняшнего" oninput="daysDirty('${esc(u.id)}')">
        <button class="btn btn-ghost btn-sm" onclick="addDays('${esc(u.id)}',30)">+30</button>
        <button class="btn btn-ghost btn-sm" onclick="addDays('${esc(u.id)}',365)">+365</button>
        <button class="btn btn-ghost btn-sm" title="Бессрочно" onclick="setInf('${esc(u.id)}')">∞</button>
        <button id="s_${esc(u.id)}" class="btn btn-ghost btn-sm" onclick="saveDays('${esc(u.id)}')">Сохранить</button></div>`;
    }
    const chain = u.chain.length ? `<div class="muted">цепочка: ${esc(u.chain.join(' → '))} → ${esc(u.fio || u.login)}</div>` : '';
    return `<tr>
      <td><b>${esc(u.fio || '—')}</b>${u.role === 'admin' ? ' <span class="lvl ok">админ</span>' : ''}<br><a href="mailto:${esc(u.email)}">${esc(u.email)}</a></td>
      <td>${u.phone ? `<a href="tel:+${esc(u.phone)}">+${esc(u.phone)}</a>` : '—'}</td>
      <td>${[u.max ? 'MAX' : '', u.telegram ? 'Telegram' : ''].filter(Boolean).join(', ') || '<span class="muted">не привязан</span>'}</td>
      <td>${st}</td>
      <td>${fdt(u.created)}</td><td>${fdt(u.last_login)}</td>
      <td>${esc(u.invited_by || '—')}${chain}</td>
      <td title="${esc(u.invitees.join(', '))}">${u.invited_count || '—'}</td>
      <td><span class="lvl">${esc(u.level)}</span></td>
      <td>${days}</td>
      <td>${u.role === 'admin' ? '<span class="muted">—</span>' : `<input type="number" min="0" max="999" id="p_${esc(u.id)}" value="${u.photos ?? u.photos_default}" style="width:54px" title="Фото в день (3 уровень)"> <button class="btn btn-ghost btn-sm" onclick="savePhotos('${esc(u.id)}')">✓</button>`}</td></tr>`;
  }).join('') || '<tr><td colspan="11" class="muted">Никого не найдено</td></tr>';
}
function renderTree(){
  const box = document.getElementById('refTree');
  const inv = U.filter(u => u.invited_count).sort((a, b) => b.invited_count - a.invited_count);
  box.innerHTML = inv.length ? inv.map(u => `<div class="row"><div class="k"><b>${esc(u.fio || u.login)}</b><br><span class="muted">${u.invited_count} чел.</span></div>
    <div>${esc(u.invitees.join(', '))}${u.chain.length ? `<div class="muted">его/её пригласил: ${esc(u.chain.join(' → '))}</div>` : ''}</div></div>`).join('')
    : '<div class="muted">Приглашений пока нет (приглашения — через кнопку «Пригласить друга» в ботах)</div>';
}
function renderLog(log){
  const box = document.getElementById('accLog');
  box.innerHTML = log.length ? log.slice(0, 50).map(l => `<div class="row"><div class="k">${fdt(l.ts)}</div>
    <div><b>${esc(l.login)}</b>: ${esc(l.days_before === 'бессрочно' ? 'бессрочно' : l.days_before + ' дн.')} → <b>${esc(l.days_after === 'бессрочно' ? 'бессрочно' : l.days_after + ' дн.')}</b>
    ${l.note ? ' · ' + esc(l.note) : ''} <span class="muted">(${esc(l.admin)})</span></div></div>`).join('')
    : '<div class="muted">Изменений доступа пока не было</div>';
}
async function adminPost(body){
  const y = window.scrollY;
  try {
    const r = await fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok || d.error) { alert(d.error || 'Ошибка'); return false; }
    await loadAdmin();
    window.scrollTo(0, y);   // таблица перерисовалась — возвращаем экран на место
    return true;
  } catch (e) { alert('Не получилось: ' + e.message); return false; }
}
function daysDirty(id){   // дни изменились — «Сохранить» становится оранжевой
  const b = document.getElementById('s_' + id);
  if (b) b.className = 'btn btn-acc btn-sm';
}
function trialDirty(){
  const b = document.getElementById('trialSave');
  if (b) b.className = 'btn btn-acc btn-sm';
}
function addDays(id, n){
  const u = U.find(x => x.id === id), inp = document.getElementById('d_' + id);
  const base = u && !u.access.unlimited ? u.access.days : 0;
  inp.value = Math.min(3650, (parseInt(inp.value) || base) + n);
  daysDirty(id);
  inp.focus();
}
function setInf(id){   // «∞» — просто ставит знак в поле; сохраняет кнопка «Сохранить»
  const inp = document.getElementById('d_' + id);
  inp.value = '∞';
  daysDirty(id);
  inp.focus();
}
async function saveDays(id){
  const v = (document.getElementById('d_' + id).value || '').trim();
  if (v === '∞') return adminPost({ id, action: 'access', unlimited: true });
  const days = parseInt(v, 10);
  if (!(days >= 0 && days <= 3650)) return alert('Дней доступа — целое число от 0 до 3650 или «∞»');
  await adminPost({ id, action: 'access', days });
}
async function approve(id){ await adminPost({ id, action: 'approve' }); }
async function savePhotos(id){
  const n = parseInt(document.getElementById('p_' + id).value, 10);
  if (!(n >= 0 && n <= 999)) return alert('Фото — число от 0 до 999');
  await adminPost({ id, action: 'photos', photos: n });
}
async function saveTrial(){
  const v = parseInt(document.getElementById('trialDays').value, 10) || 0;
  const r = await fetch('/api/admin/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trialDays: v }) });
  const d = await r.json();
  if (d.error) return alert(d.error);
  document.getElementById('trialDays').value = d.trialDays;   // сохранённое значение
  const b = document.getElementById('trialSave');
  if (b) b.className = 'btn btn-ghost btn-sm';                // изменений нет — кнопка серая
}

// ---------- «глазок» у полей пароля ----------
const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function addPasswordEyes(root){
  (root || document).querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp => {
    inp.dataset.eye = '1';
    const wrap = document.createElement('span');
    wrap.className = 'pw';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pw-eye';
    b.setAttribute('aria-label', 'Показать пароль'); b.setAttribute('aria-pressed', 'false'); b.title = 'Показать пароль';
    b.innerHTML = EYE_ON;
    b.onclick = () => {
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.setAttribute('aria-pressed', String(show));
      b.title = show ? 'Скрыть пароль' : 'Показать пароль';
      b.setAttribute('aria-label', b.title);
      b.innerHTML = show ? EYE_OFF : EYE_ON;
      inp.focus();
    };
    wrap.appendChild(b);
  });
}
// при закрытии окна пароли снова скрываются
function hidePasswords(){
  document.querySelectorAll('input[data-eye]').forEach(inp => {
    inp.type = 'password';
    const b = inp.parentNode.querySelector('.pw-eye');
    if (b) { b.setAttribute('aria-pressed', 'false'); b.title = 'Показать пароль'; b.setAttribute('aria-label', b.title); b.innerHTML = EYE_ON; }
  });
}

load();
// Firefox помнит введённый в поле текст для истории вкладки и возвращает его при входе/обновлении
// (даже после выполнения кода выше) — последний рубеж: на показ страницы поле очищается снова
window.addEventListener('pageshow', () => {
  const u = document.getElementById('uFilter');
  if (u && filterText === "") u.value = "";
});
// Firefox возвращает введённый ранее текст из истории вкладки с задержкой ПОСЛЕ загрузки —
// дежурная проверка выигрывает эту гонку: пока поиск не используется, поле остаётся пустым
setInterval(() => {
  const uf = document.getElementById('uFilter');
  if (uf && filterText === "" && uf.value !== "" && document.activeElement !== uf) uf.value = "";
}, 250);
</script>
